# Fotos je Seite. Die Texte in ../texte/ bleiben unverändert; die Bilder werden beim Rendern eingefügt.
#   url:          Seiten-URL
#   datei:        Pfad unter src/assets/bilder/ (Lizenzeintrag in bilder-lizenzen.yaml ist Pflicht)
#   alt:          sachliche Beschreibung des Motivs (Pflicht)
#   unterschrift: Bildunterschrift; der Nachweis „Foto: Urheber, Lizenz, via Quelle“ wird aus bilder-lizenzen.yaml ergänzt
#   position:     „titel“ (Titelbild im Kopfbereich) oder „nach Abschnitt <H2-Überschrift oder ihr Anfang>“ (Bild am Ende des Abschnitts)
#   fokus:        optional, CSS object-position für den Bildausschnitt des Titelbilds (z. B. „center 30%“)
# Die Fotos zeigen Orte und typische Motive, nie die konkrete Wohnung. Build bricht ab bei fehlendem Lizenzeintrag, Alt-Text oder Abschnitt.
seiten:
  # ---------------------------------------------------------------- Ortsseiten
  - url: /wohnung-verkaufen/leonberg/
    bilder:
      - datei: leonberg/marktplatz-fachwerk.jpg
        position: titel
        alt: Fachwerkhäuser und Altes Rathaus am Marktplatz in Leonberg bei blauem Himmel
        unterschrift: Marktplatz in der Leonberger Altstadt
      - datei: leonberg/pomeranzengarten.jpg
        position: nach Abschnitt Die Stadtteile
        alt: Pomeranzengarten mit Brunnen und Beeten vor dem Leonberger Schloss
        unterschrift: Pomeranzengarten unterhalb des Schlosses in der Leonberger Altstadt

