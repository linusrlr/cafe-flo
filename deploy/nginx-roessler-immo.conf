# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header X-Frame-Options "DENY" always;
# add_header Content-Security-Policy $csp always;
#
# PHP-FPM (php.ini/Pool): expose_php=Off, display_errors=Off, log_errors=On, post_max_size=1M.
# Formular-Konfiguration: /var/www/roessler-immo/formular-config.php (neben dem Webroot, chmod 600),
#   Vorlage site/formular-config.example.php. Datenordner /var/www/roessler-immo/formular-daten (chmod 700).
