# nginx für roessler-immo.de (bauplan/01-technik.md Abschnitte 8, 14, 15). VPS-Variante.
# Installation:  sudo cp nginx-roessler-immo.conf /etc/nginx/sites-available/roessler-immo.conf
#                sudo ln -s ../sites-available/roessler-immo.conf /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx
# Plesk (netcup Webhosting): www-Umleitung über „Bevorzugte Domain“, die add_header-Zeilen und location-Blöcke
#   (ohne limit_req_zone/map/log_format) unter „Apache & nginx → Zusätzliche nginx-Anweisungen“ eintragen.
# Pfade anpassen: ROOT=/var/www/roessler-immo/web, PHP-FPM-Socket, Zertifikat.
# CSP-Hash: aus deploy/csp-hashes.txt (ändert sich nur, wenn das Hash-Weiterleitungsskript geändert wird).

# --- http-Kontext (eine Ebene über server; in Debian/Ubuntu steht diese Datei bereits dort) ---
limit_req_zone $binary_remote_addr zone=formulare:1m rate=6r/m;
server_tokens off;
map $remote_addr $ip_anon {
  ~(?P<a>\d+\.\d+\.\d+)\.\d+                 $a.0;
  ~(?P<a>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):     $a::;
  default                                    0.0.0.0;
}
log_format anon '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {                                   # HTTP -> HTTPS Apex
  listen 80; listen [::]:80;
  server_name roessler-immo.de www.roessler-immo.de;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://roessler-immo.de$request_uri; }
}

server {                                   # www -> Apex
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name www.roessler-immo.de;
  ssl_certificate     /etc/letsencrypt/live/roessler-immo.de/fullchain.pem;   # Zertifikat muss www enthalten
  ssl_certificate_key /etc/letsencrypt/live/roessler-immo.de/privkey.pem;
  return 301 https://roessler-immo.de$request_uri;
}

server {
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name roessler-immo.de;
  ssl_certificate     /etc/letsencrypt/live/roessler-immo.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/roessler-immo.de/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/roessler-immo/web;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  gzip on; gzip_static on; gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

  access_log /var/log/nginx/roessler-immo.access.log anon;   # gekürzte IP, Aufbewahrung 14 Tage per logrotate
  error_page 404 /404.html;

  # Sicherheits-Header. Wichtig: add_header in einem location-Block hebt die der Ebene darüber auf,
  # deshalb steht dieser Block per include in jedem location mit eigenen Headern.
  # HSTS zunächst kurz (300 s); nach einer Woche ohne Fehler auf 31536000 erhöhen.
  set $csp "default-src 'none'; script-src 'self' 'sha256-RDlDVFY8ZvdvKqxJX3/NFpyK7ltg/jNCIFAqn5NQ0xs='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; manifest-src 'self'; object-src 'none'; upgrade-insecure-requests";
  include /etc/nginx/snippets/roessler-sicherheit.conf;

  location = /index.html { return 301 /; }

  location / {
    include /etc/nginx/snippets/roessler-sicherheit.conf;
    add_header Cache-Control "public, max-age=600" always;       # HTML
    try_files $uri $uri/ =404;
  }

  location ^~ /_astro/ {                   # gehashte CSS/JS/Bilder
    include /etc/nginx/snippets/roessler-sicherheit.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /_formular/ { return 404; }  # PHP-Kern, Formulardaten: nie direkt abrufbar
  location ^~ /.well-known/ { include /etc/nginx/snippets/roessler-sicherheit.conf; try_files $uri =404; }
  location ~ /\. { deny all; }             # .git, .env usw.

  location ~* \.(?:ico|svg|png|jpg|webmanifest|pdf|txt|woff2)$ {   # ungehashte Dateien aus public/
    include /etc/nginx/snippets/roessler-sicherheit.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location ~ ^/(kontakt|bewertung)\.php$ {
    limit_req zone=formulare burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    include /etc/nginx/snippets/roessler-sicherheit.conf;
    add_header Cache-Control "no-store" always;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # Version prüfen: ls /run/php/
  }

  location ~ \.php$ { return 404; }        # keine weiteren PHP-Dateien ausführbar
  location = /e { access_log /var/log/nginx/roessler-immo.events.log anon; return 204; }
  location = /404.html { internal; }
}

