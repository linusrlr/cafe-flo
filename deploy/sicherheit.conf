# /etc/nginx/snippets/roessler-sicherheit.conf  (siehe nginx-roessler-immo.conf)
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;   # nach 1 Woche: 31536000
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy $csp always;
