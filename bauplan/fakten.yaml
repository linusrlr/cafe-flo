# fakten.yaml: zentrale Datei für alle veränderlichen Fakten von roessler-immo.de
#
# Zweck: Werte, die sich ändern (Provision, Fristen, Verordnungen, Hebesätze,
# Preise, Mieten, Zinsen, Förderkonditionen, Kontaktdaten, Erlaubnisstatus),
# stehen nur hier. Texte in texte/*.md binden sie per Platzhalter ein:
#   {{fakten.sperrfrist.leonberg}}              -> wert
#   {{fakten.sperrfrist.leonberg.gueltig_bis}}  -> 31.12.2026 (Datum de-DE)
#   {{fakten.angebotspreise_etw.leonberg.immoportal.stand}}
# Regeln für Auflösung und Build-Checks: bauplan/01-technik.md, Abschnitt 5.
#
# Aufbau eines Eintrags (Blatt = Objekt mit Feld "wert"):
#   wert:          Anzeige-String, genau so, wie er im Text erscheint (deutsches Zahlformat)
#   zahl:          optional, maschinenlesbar (Punkt als Dezimaltrenner), für Rechnungen/JSON-LD
#   quelle:        Kurzangabe der Quelle (Titel, Herausgeber)
#   url:           optional, Quelle als URL
#   stand:         ISO-Datum (YYYY-MM-DD), an dem der Wert zuletzt geprüft bzw. veröffentlicht wurde.
#                  Quartalswerte: letzter Tag des Quartals; stand_text nennt die Originalangabe.
#   stand_text:    optional, Anzeigeform des Stands ("2. Quartal 2026")
#   gueltig_bis:   optional, ISO-Datum, bis zu dem der Wert rechtlich gilt
#   stichtag:      optional, ISO-Datum, ab dem sich etwas ändert (Text muss dann umgeschrieben werden)
#   pruefintervall_monate: optional, überschreibt die 6-Monats-Regel (Zinsen 1, Portalpreise 3)
#   status:        geprueft | zu_pruefen | offen   (zu_pruefen/offen auf veröffentlichter Seite = Build-Fehler)
#   hinweis:       optional, interne Notiz, wird nie gerendert
#   verwendet_in:  Liste der Textdateien (Basename ohne .md), die den Wert heute enthalten.
#
# verwendet_in wurde am 2026-11-01 per grep über texte/*.md UND texte/_langfassung/*.md ermittelt
# (Ortsseiten liegen derzeit nur in _langfassung/, eine parallele Session kürzt die Texte).
# Nach Abschluss der Kürzung neu erzeugen: `npm run fakten:verwendung` (Skript in 01-technik.md 5.5).
# Die grep-Muster je Eintrag stehen im Feld "muster", damit das Skript sie wiederverwenden kann.

_meta:
  ermittelt_am: 2026-11-01
  pruefintervall_monate_standard: 6
  vorwarnung_gueltig_bis_tage: 45
  zeitzone: Europe/Berlin

