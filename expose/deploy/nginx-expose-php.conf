# /etc/nginx/snippets/expose-php.conf: PHP-FPM für die Exposé-Endpunkte
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param HTTPS on;                 # PHP erkennt HTTPS (HSTS, __Host-Cookie, https_erzwingen)
fastcgi_param HTTP_PROXY "";            # httpoxy
fastcgi_hide_header X-Powered-By;
fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # Version prüfen: ls /run/php/
# PHP-FPM (php.ini oder Pool): expose_php=Off, display_errors=Off, log_errors=On, file_uploads=Off (nur dieser Pool),
#   post_max_size=1M, session.save_path wird von admin.php auf expose-daten/sitzungen gesetzt.
