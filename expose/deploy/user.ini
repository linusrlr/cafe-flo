; PHP-Einstellungen für netcup Webhosting (Plesk): als .user.ini in den Webroot (httpdocs/) legen
; oder in Plesk unter „PHP-Einstellungen“ eintragen. Gilt auch für kontakt.php der Hauptseite (verträglich).
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
post_max_size = 1M
upload_max_filesize = 1M
max_input_vars = 200
session.use_strict_mode = 1
session.cookie_httponly = 1
; expose_php und file_uploads lassen sich nur in Plesk („PHP-Einstellungen“) bzw. php.ini setzen: expose_php=Off
