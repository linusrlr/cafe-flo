# Exposé-Freigabe: Ergänzung zu ../../deploy/nginx-roessler-immo.conf (vServer mit eigener nginx-Konfiguration).
# Installation:
#   sudo cp nginx-expose.conf      /etc/nginx/snippets/expose-locations.conf
#   sudo cp nginx-expose-php.conf  /etc/nginx/snippets/expose-php.conf
#   in nginx-roessler-immo.conf im server-Block für roessler-immo.de (443) die Zeile
#       include /etc/nginx/snippets/expose-locations.conf;
#   aktivieren (steht dort als Hinweis), dazu im http-Kontext die zwei Zeilen aus dem Kopf unten.
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verzeichnisse (Webroot getrennt von Code und Daten):
#   /var/www/roessler-immo/web/              Webroot: Astro-Seite + dist/web der Exposé-Freigabe (statisch + 5 PHP-Stubs)
#   /var/www/roessler-immo/expose-backend/   Code, Objektdaten, geschützte Voll-Exposés, config.php, geheimnisse.php (nicht im Webroot)
#   /var/www/roessler-immo/expose-daten/     Nachweise, Vorgänge, Rate-Limit, Sitzungen, Log (chmod 700, nicht im Webroot)
#   /var/www/roessler-immo/expose-backup/    verschlüsselte Sicherungen (deploy/backup.sh)
#
# ---- http-Kontext (einmal, neben limit_req_zone formulare der Hauptseite) ----
#   limit_req_zone $binary_remote_addr zone=expose_abruf:1m rate=30r/m;
#   log_format anon_ohne_query '$ip_anon - - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "-" "$http_user_agent"';
# anon_ohne_query: Der Exposé-Token steht in der Query (?t=…). Er darf nicht im Access-Log landen.
#
# Header: Für die PHP-Endpunkte setzt PHP alle Sicherheits-Header selbst (CSP mit Stil-Hashes für das Voll-Exposé).
# Das add_header unten hebt die Server-Header der Hauptseite (deren CSP würde das Voll-Exposé blockieren) für
# diese locations auf (nginx erbt add_header nur, wenn eine location keine eigenen hat).

location = /anfrage.php {
  limit_req zone=formulare burst=5 nodelay;
  limit_req_status 429;
  client_max_body_size 64k;
  access_log /var/log/nginx/roessler-immo.access.log anon_ohne_query;
  add_header X-Content-Type-Options "nosniff" always;
  include /etc/nginx/snippets/expose-php.conf;
}
location = /widerruf.php {
  limit_req zone=formulare burst=5 nodelay;
  limit_req_status 429;
  client_max_body_size 64k;
  access_log /var/log/nginx/roessler-immo.access.log anon_ohne_query;
  add_header X-Content-Type-Options "nosniff" always;
  include /etc/nginx/snippets/expose-php.conf;
}
location = /expose.php {
  limit_req zone=expose_abruf burst=20 nodelay;
  limit_req_status 429;
  client_max_body_size 1k;
  access_log /var/log/nginx/roessler-immo.access.log anon_ohne_query;
  add_header X-Content-Type-Options "nosniff" always;
  include /etc/nginx/snippets/expose-php.conf;
}
location = /freigabe.php {
  limit_req zone=formulare burst=5 nodelay;
  limit_req_status 429;
  client_max_body_size 4k;
  access_log /var/log/nginx/roessler-immo.access.log anon_ohne_query;
  add_header X-Content-Type-Options "nosniff" always;
  include /etc/nginx/snippets/expose-php.conf;
}
location = /expose-admin.php {
  # Zweite Schicht vor dem eigenen Login (empfohlen): feste IP und/oder Basic-Auth
  #   allow 203.0.113.17;  deny all;
  #   auth_basic "Expose"; auth_basic_user_file /etc/nginx/expose-admin.htpasswd;   (htpasswd -B -c …)
  limit_req zone=formulare burst=10 nodelay;
  limit_req_status 429;
  client_max_body_size 8k;
  access_log /var/log/nginx/roessler-immo.access.log anon_ohne_query;
  add_header X-Content-Type-Options "nosniff" always;
  include /etc/nginx/snippets/expose-php.conf;
}

# Statische Exposé-Seiten: Header der Hauptseite (deren CSP passt, die Seiten haben keine Inline-Stile/-Skripte)
location ^~ /objekte/ {
  include /etc/nginx/snippets/roessler-sicherheit.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;   # erst entfernen, wenn Objekte gefunden werden sollen
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ =404;
}
location ^~ /vertrag-widerrufen/ {
  include /etc/nginx/snippets/roessler-sicherheit.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ =404;
}
location ^~ /expose-recht/ {
  include /etc/nginx/snippets/roessler-sicherheit.conf;
  add_header X-Robots-Tag "noindex" always;
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ =404;
}
location ^~ /expose-assets/ {
  include /etc/nginx/snippets/roessler-sicherheit.conf;
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}
# .htaccess und andere Punktdateien sperrt bereits „location ~ /\. { deny all; }“ der Hauptkonfiguration;
# alle übrigen *.php liefert „location ~ \.php$ { return 404; }“ nicht aus.
