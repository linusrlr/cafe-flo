# Manuell auslösbar (Actions → "bauen-und-ausliefern" → Run workflow). Liefert nur aus, wenn alle Prüfungen grün sind.
# Secrets (Settings → Secrets and variables → Actions): DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
name: bauen-und-ausliefern
on:
  workflow_dispatch:
    inputs:
      ausliefern:
        description: 'Nach grünen Tests ausliefern?'
        type: boolean
        default: false
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: site/.nvmrc, cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: intl, tools: none }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pruefen
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: site/dist, include-hidden-files: true }
  ausliefern:
    needs: pruefen
    if: ${{ inputs.ausliefern }}
    runs-on: ubuntu-24.04
    environment: produktion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: site/dist }
      - name: SSH einrichten
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash deploy/deploy.sh
